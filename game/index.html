<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quest for Joric</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/characters/Player_A.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/src/game.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/src/game.js" type="module"></script>
    <script>
        // Reset game functionality
        document.addEventListener('DOMContentLoaded', function () {
            const resetBtn = document.getElementById('reset-game-btn');
            if (resetBtn) {
                resetBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (confirm('Are you sure you want to reset the game? This will clear all progress.')) {
                        localStorage.removeItem('ChatbotGame');
                        window.location.href = '/';
                    }
                });
            }
        });
    </script>
</head>

<body>
    <!-- Settings gear button in upper left -->
    <div class="dropdown position-fixed" style="top: 20px; left: 20px; z-index: 1050;">
        <button class="btn btn-outline-secondary rounded-circle p-2" type="button" id="settingsDropdown"
            data-bs-toggle="dropdown" aria-expanded="false" title="Settings">
            <i class="fa-solid fa-cog"></i>
        </button>
        <ul class="dropdown-menu" aria-labelledby="settingsDropdown">
            <li><a class="dropdown-item text-danger" href="#" id="reset-game-btn">
                    <i class="fa-solid fa-rotate-left me-2"></i>Reset Game
                </a></li>
        </ul>


    </div>

    <div id="setting-bg"></div>
    <div class="container-fluid d-flex flex-column p-0">
        <div id="main-content" class="row flex-grow-1 m-0">
            <div class="col-3 d-flex flex-column align-items-center justify-content-start p-3">
                <div id="player-card" class="card w-100 text-center mb-3">
                    <div class="card-body">
                        <div class="avatar mx-auto mb-2" id="player-avatar"></div>
                        <h5 class="card-title" id="player-name">Player</h5>
                    </div>
                </div>
                <div id="backpack-area" class="w-100 item-container mb-3">
                    <h6 class="text-start">Your inventory:</h6>
                    <div class="backpack" id="backpack"></div>
                </div>
                <div id="location-context-area" class="w-100">
                    <div id="room-items-area" class="w-100 item-container mb-3">
                        <h6 class="text-start">Items at this location:</h6>
                        <div id="items-list" class="items-list">
                        </div>
                    </div>
                    <div id="navigation-area" class="w-100 item-container mb-3">
                        <h6 class="text-start">From here you can get to:</h6>
                        <div id="location-nav" class="d-flex flex-column gap-2">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-6 d-flex flex-column align-items-center justify-content-start p-3" id="center-column">
                <div id="location-header" class="w-100 mb-4">
                    <h2 id="location-name" class="mb-2 text-center"></h2>
                    <div id="location-desc" class="mb-2 text-start"></div>
                    <div id="location-avatars" class="d-flex justify-content-center gap-3 mt-3">
                    </div>
                </div>

                <div id="chat-ui" class="w-100" style="display:none;">
                    <!-- Encounter card header integrated into chat UI -->
                    <div id="encounter-header" class="encounter-header mb-3">
                        <button type="button" class="btn-close" id="close-encounter-btn" aria-label="Close"></button>
                        <div class="avatar mx-auto mb-2" id="encounter-avatar"></div>
                        <h5 class="encounter-name" id="encounter-name"></h5>
                        <div class="encounter-desc" id="encounter-desc"></div>
                        <button id="begin-chat-btn" class="btn btn-primary mt-3">Begin Encounter</button>
                    </div>

                    <!-- Chat content that appears after beginning encounter -->
                    <div id="chat-content" style="display:none;">
                        <div class="chat-messages mb-3" id="chat-messages"></div>
                        <div id="offerings-area" class="item-container mb-3">
                            <h6>Offerings</h6>
                            <div class="offerings" id="offerings"></div>
                        </div>
                        <form id="chat-form" autocomplete="off">
                            <div class="input-group">
                                <input type="text" id="user-input" class="form-control"
                                    placeholder="Type your message..." required>
                                <button class="btn btn-primary" type="submit">
                                    <i class="fa-solid fa-paper-plane"></i>
                                </button>
                            </div>
                            <div class="form-text text-muted mt-1">
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="regenerate-btn">
                                    <i class="fa-solid fa-arrows-rotate"></i> Attack
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="regenerate-btn">
                                    <i class="fa-solid fa-arrows-rotate"></i> Leave
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-3 d-flex flex-column align-items-center justify-content-start p-3">
            </div>
        </div>
    </div>

    <div id="introduction-screen">
        <!-- Game.State.introductionText innerHTML, e.g.: -->
        <h1>Welcome to Quest for Joric</h1>
        <div id="intro-text">Choose your avatar to begin your adventure.</div>
        <div class="avatar-row" id="avatar-row">
            <div class="avatar-box">
                <img src="/characters/Player_A.png" class="avatar-img">
                <div class="avatar-label">Avatar A</div>
            </div>
            <div class="avatar-box">
                <img src="/characters/Player_B.png" class="avatar-img">
                <div class="avatar-label">Avatar B</div>
            </div>
            <div class="avatar-box">
                <img src="/characters/Player_C.png" class="avatar-img">
                <div class="avatar-label">Avatar C</div>
            </div>
            <div class="avatar-box">
                <img src="/characters/Player_D.png" class="avatar-img">
                <div class="avatar-label">Avatar D</div>
            </div>
        </div>
    </div>
</body>

</html>
