<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Data Editor</title>
    <link rel="stylesheet" href="src/train.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Training Data Editor</h1>
            <p>Edit and manage training data for the chatbot adventure game</p>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('world-data')">World Data</button>
            <button class="tab-btn" onclick="switchTab('training-data')">Training Data</button>
        </div>

        <div class="status-bar">
            <span id="statusText">Ready</span>
        </div>

        <!-- World Data Tab -->
        <div id="world-data-tab" class="tab-content active">
            <div class="controls">
                <button class="btn btn-primary" onclick="refreshWorldData()">Refresh World Data</button>
                <select id="characterSelect" onchange="selectCharacter()" class="form-control">
                    <option value="">Select a character...</option>
                </select>
            </div>

            <div class="content">
                <div class="panel">
                    <h3>Character Definition (from world.js)</h3>
                    <div class="form-group">
                        <label>Character ID:</label>
                        <input type="text" id="worldCharacterId" class="form-control" readonly>
                    </div>
                    <div class="form-group">
                        <label>Character Name:</label>
                        <input type="text" id="worldCharacterName" class="form-control" readonly>
                    </div>
                    <div class="form-group">
                        <label>Character Description:</label>
                        <textarea id="worldCharacterDesc" class="form-control" readonly></textarea>
                    </div>
                    <div class="form-group">
                        <label>Primary Goal:</label>
                        <textarea id="worldPrimaryGoal" class="form-control" readonly></textarea>
                    </div>

                    <div class="trades-section">
                        <h4>Trades (from world.js)</h4>
                        <div id="worldTradesContainer"></div>
                    </div>
                </div>

                <div class="panel">
                    <h3>Generated System Prompt (Preview)</h3>
                    <div class="system-prompt" id="worldSystemPrompt">
                        <!-- Auto-generated system prompt preview will appear here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Training Data Tab -->
        <div id="training-data-tab" class="tab-content">
            <div class="controls">
                <div class="file-controls">
                    <input type="file" id="fileInput" accept=".jsonl" />
                    <button class="btn btn-primary" onclick="loadFile()">Load Training Data</button>
                    <button class="btn btn-secondary" onclick="saveFile()">Save Changes</button>
                    <button class="btn btn-secondary" onclick="exportFile()">Export JSONL</button>
                </div>

                <div class="navigation">
                    <button class="btn btn-secondary" onclick="previousItem()" id="prevBtn" disabled>← Previous</button>
                    <span class="current-item" id="itemCounter">No data loaded</span>
                    <button class="btn btn-secondary" onclick="nextItem()" id="nextBtn" disabled>Next →</button>
                </div>
            </div>

            <div class="content">
                <div class="panel conversation-area">
                    <h3>Conversation Messages</h3>
                    <div class="conversation-controls">
                        <button class="btn btn-primary" onclick="addMessagePair()">Add User/Assistant Pair</button>
                        <button class="btn btn-secondary" onclick="removeLastMessagePair()">Remove Last Pair</button>
                    </div>
                    <div class="messages" id="messagesContainer">
                        <!-- Training conversation will appear here -->
                    </div>
                </div>

                <div class="panel">
                    <h3>Conversation Analysis</h3>
                    <div class="form-group">
                        <label>Detected Character:</label>
                        <input type="text" id="detectedCharacter" class="form-control" readonly>
                    </div>
                    <div class="form-group">
                        <label>Original System Prompt:</label>
                        <textarea id="originalSystemPrompt" class="form-control" readonly rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Parsed Goal/State:</label>
                        <textarea id="parsedState" class="form-control" readonly rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Detected Trades/Offers:</label>
                        <div id="detectedTrades" class="detected-trades"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/train.js"></script>
</body>

</html>
